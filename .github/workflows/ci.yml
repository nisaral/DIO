name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: dio-serve
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dio-serve/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Verify the version has a single source of truth
        run: |
          python -c "import dio, importlib.metadata as m; assert dio.__version__ == m.version('dio-serve'), (dio.__version__, m.version('dio-serve'))"

      - name: Tests
        run: pytest tests/ -q

  smoke:
    name: CLI smoke (zero GPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dio-serve
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dio-serve/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build a config from scratch
        run: |
          dio version
          dio init --no-detect --output dio.ci.yaml
          dio config --config dio.ci.yaml

      - name: Run the offline demo (mock backends, no GPU)
        run: dio demo --port 18085 --duration 4

  package:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dio-serve
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Confirm the license ships with the distribution
        run: |
          python -c "import pathlib, tarfile; sdist = next(pathlib.Path('dist').glob('*.tar.gz')); names = tarfile.open(sdist).getnames(); assert any(n.endswith('LICENSE') for n in names), names[:10]"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dio-serve/dist/
          if-no-files-found: error
