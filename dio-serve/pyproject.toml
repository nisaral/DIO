[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dio-serve"
dynamic = ["version"]
description = "DIO: predictive NLMS orchestrator that wraps vLLM, Ollama, SGLang, and OpenAI engines - zero engine patches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "DIO Authors", email = "Nisarkeyush3@gmail.com" },
]
keywords = [
  "llm", "vllm", "ollama", "inference", "scheduling", "load-balancing",
  "nlms", "openai", "heterogeneous-gpu", "serving",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.3"]
bench = ["matplotlib>=3.7", "numpy>=1.24"]
nvml = ["pynvml>=11.5"]

[project.urls]
Homepage = "https://github.com/nisaral/DIO"
Documentation = "https://github.com/nisaral/DIO#readme"
Repository = "https://github.com/nisaral/DIO"
Issues = "https://github.com/nisaral/DIO/issues"

[project.scripts]
dio = "dio.cli:app"
dio-serve = "dio.cli:app"

[tool.setuptools.dynamic]
# Single source of truth: dio/_version.py
version = { attr = "dio._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"

[tool.ruff]
# The package supports Python >= 3.9, so lint against the lowest supported version.
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "RUF"]
ignore = [
  "E501",   # long lines in help text, tables and URLs
  "B008",   # typer.Option(...) in a default is the required Click/Typer idiom
  "RUF002", # docstrings intentionally use the cost-model symbols (y-hat, sigma, mu)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
