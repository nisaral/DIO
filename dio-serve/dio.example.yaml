# DIO Configuration — Distributed Inference Orchestrator (v0.4.2)
# Docs: https://github.com/nisaral/DIO

# Backends pool: configure your local and remote inference engines.
backends:
  # 1. Primary GPU (vLLM instance on port 8000)
  - id: local-gpu
    url: http://localhost:8000
    tier: large
    engine: vllm
    models:
      - meta-llama/Llama-3.2-3B-Instruct

  # 2. Ollama instance (port 11434, local GPU/CPU)
  - id: ollama-local
    url: http://localhost:11434
    tier: small
    engine: ollama
    models:
      - llama3
      - codellama
      - mistral

  # 3. Secondary GPU or cloud server (uncomment to activate)
  # - id: cloud-a100
  #   url: http://10.0.1.5:8000
  #   tier: large
  #   engine: vllm
  #   total_vram_mb: 81920
  #   models:
  #     - meta-llama/Llama-3.1-70B-Instruct

# Predictive latency scheduler settings
scheduler:
  strategy: nlms        # Options: nlms | rls | ewma | static | round_robin | least_loaded
  nlms_mode: dual       # dual: fast µ (0.1) for bursts + slow µ (0.01) for thermal drift
  engine_metrics: true  # Non-invasive scraping of vLLM /metrics for KV-cache pressure
  cache_bonus_ms: 200   # Affinity bonus for session/prefix reuse in multi-turn chat

# Admission control to prevent queue overload and protect SLOs
admission:
  mode: empirical       # Options: empirical (observed-percentile gate) | strict | rank_only | absolute
                        # empirical only sheds when the pool looks uniformly saturated;
                        # strict sheds whenever the observed tail exceeds slo_ms.
  slo_ms: 30000         # Maximum acceptable end-to-end latency threshold (ms)
  percentile: 95        # Percentile gate for empirical / strict mode

# Server listen settings
server:
  host: 0.0.0.0
  port: 8085
  timeout: 300          # Request timeout in seconds
  body_size_cap_bytes: 8388608   # 413 above this declared body size (0 disables)
  prompt_chars_cap: 1000000      # 413 above this extracted-prompt length (0 disables)

# Security. DIO is a control plane, not an auth layer: terminate auth in front of
# it, or set api_key here. data_plane_auth extends the key to /v1/* and /api/*
# (only do that when DIO itself is the thing listening on the port).
security:
  # api_key: change-me          # or set DIO_API_KEY in the environment
  protect_debug: true           # /debug/* requires the key when api_key is set
  data_plane_auth: false        # also require it on /v1/* and /api/*
